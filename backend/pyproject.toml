[project]
name = "rapport"
version = "1.0.0"
description = "Rapport (心迹) — self-hosted AI relationship chat analyzer: affinity index, persona profile, playbook. Local-first, BYOK."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rapport contributors" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "cryptography>=43",
    "openai>=1.50",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ocr = ["rapidocr==3.9.2", "onnxruntime>=1.17", "pillow>=10", "numpy>=1.26"]
ocr-gpu = [
    "rapidocr==3.9.2",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "onnxruntime>=1.17; sys_platform != 'win32'",
    "pillow>=10",
    "numpy>=1.26",
]
desktop = ["uiautomation>=2.0; sys_platform == 'win32'"]
wechat-database = ["zstandard>=0.23", "psutil>=7"]
research-signals = ["jieba==0.42.1", "ruptures==1.1.10"]

[tool.uv]
conflicts = [[{ extra = "ocr" }, { extra = "ocr-gpu" }]]

[project.scripts]
rapport = "rapport.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pillow>=10",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rapport"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["rapport/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
